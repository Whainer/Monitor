name: Monitorar Página

on:
  schedule:
    - cron: '7 */4 * * *'   # 6x por dia (00:07, 04:07, 08:07, 12:07, 16:07, 20:07 UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Monitorar
        env:
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          SENHA_APP: ${{ secrets.SENHA_APP }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
          URL: ${{ secrets.URL }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          PROXY_PORT: ${{ secrets.PROXY_PORT }}
          PROXY_USER: ${{ secrets.PROXY_USER }}
          PROXY_PASSWORD: ${{ secrets.PROXY_PASSWORD }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python .github/workflows/monitor.py

          git add ultimo_hash.txt
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza histórico do monitor"
            git pull --rebase && git push
          fi
